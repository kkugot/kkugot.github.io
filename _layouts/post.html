---
layout: default
---
<article class="blog-post">
  <nav aria-label="Breadcrumb"><a href="{{ '/blog/' | relative_url }}">← Blog</a></nav>
  <header>
    <h1>{{ page.title | escape }}</h1>
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%d %B %Y" }}</time>
  </header>
  {{ content }}
</article>
